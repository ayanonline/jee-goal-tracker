<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - PreTrack</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box" style="max-width: 500px;">
            <div class="auth-form active">
                <div class="auth-header">
                    <h2>Reset Password</h2>
                    <p>Enter your new password below</p>
                </div>

                <form id="resetPasswordForm" onsubmit="event.preventDefault(); resetPassword();">
                    <div id="resetMessage" class="auth-message"></div>

                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="newPassword" placeholder="New Password" required minlength="6">
                        <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('newPassword')"></i>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm New Password" required minlength="6">
                        <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('confirmPassword')"></i>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <span class="btn-text">Reset Password</span>
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </form>

                <div class="auth-footer">
                    Remember your password? <a href="index.html">Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Get the action code from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');
        const mode = urlParams.get('mode');

        if (!oobCode || mode !== 'resetPassword') {
            window.location.href = 'index.html';
        }

        // Toggle password visibility
        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling;
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Reset password function
        async function resetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resetBtn = document.querySelector('#resetPasswordForm .btn-primary');
            const messageElement = document.getElementById('resetMessage');

            // Validate passwords
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showMessage('Password must be at least 6 characters long', 'error');
                return;
            }

            try {
                const originalBtnText = resetBtn.innerHTML;
                resetBtn.disabled = true;
                resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';

                // Reset password using Firebase
                await firebase.auth().confirmPasswordReset(oobCode, newPassword);
                
                showMessage('Password reset successfully! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } catch (error) {
                console.error('Password reset error:', error);
                let message = 'Failed to reset password. Please try again.';
                
                if (error.code === 'auth/expired-action-code') {
                    message = 'The password reset link has expired. Please request a new one.';
                } else if (error.code === 'auth/invalid-action-code') {
                    message = 'Invalid password reset link. Please request a new one.';
                } else if (error.code === 'auth/weak-password') {
                    message = 'Password is too weak. Please choose a stronger password.';
                }
                
                showMessage(message, 'error');
            } finally {
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<span class="btn-text">Reset Password</span><i class="fas fa-sync-alt"></i>';
            }
        }

        // Show message function
        function showMessage(message, type = 'error') {
            const messageElement = document.getElementById('resetMessage');
            messageElement.textContent = message;
            messageElement.className = 'auth-message';
            messageElement.classList.add(type, 'show');
        }
    </script>
</body>
</html>
