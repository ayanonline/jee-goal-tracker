<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Goal Tracker</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
    <!-- Auth Container -->
    <div id="authContainer" class="auth-container" style="display: none;">
        <div class="auth-box">
            <h2>Welcome to JEE Goal Tracker</h2>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <div class="auth-buttons">
                <button id="signInBtn" type="button" onclick="signIn()" class="btn">Sign In</button>
                <button id="signUpBtn" type="button" onclick="signUp()" class="btn btn-secondary">Sign Up</button>
            </div>
            <div id="authMessage" style="margin-top: 15px; color: #ff6b6b; font-size: 0.9em; min-height: 20px;"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="container" style="display: none;">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>JEE Preparation Tracker</h1>
                    <p>Stay focused on your goals!</p>
                </div>
                <button id="signOutBtn" onclick="signOut()" class="btn btn-signout">
                    <i class="fas fa-sign-out-alt"></i> Sign Out
                </button>
            </div>

        </header>

        <div class="main-content">
            <div class="goal-form">
                <h2>Add Today's Goals</h2>
                <form id="goalForm">
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <select id="subject" required>
                            <option value="">Select Subject</option>
                            <option value="Physics">Physics</option>
                            <option value="Chemistry">Chemistry</option>
                            <option value="Mathematics">Mathematics</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="topic">Topic</label>
                        <input type="text" id="topic" placeholder="e.g., Electrostatics, Organic Chemistry" required>
                    </div>
                    <div class="form-group">
                        <label for="target">Target</label>
                        <input type="text" id="target" placeholder="e.g., Solve 30 problems, Complete 2 chapters" required>
                    </div>
                    <div class="form-group">
                        <label for="time">Time Spent (hours)</label>
                        <input type="number" id="time" min="0.5" step="0.5" placeholder="e.g., 2.5" required>
                    </div>
                    <button type="submit" class="btn">Add Goal</button>
                </form>
            </div>

            <div class="goals-list">
                <h2>Today's Progress</h2>
                <div id="todayGoals">
                    <p class="no-goals">No goals added for today. Start by adding one above!</p>
                </div>
                
                <h2>History</h2>
                <div class="date-filter">
                    <label for="historyDate">Select Date: </label>
                    <input type="date" id="historyDate">
                </div>
                <div id="historyGoals">
                    <p class="no-goals">Select a date to view past goals</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
