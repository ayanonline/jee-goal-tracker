<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#18191A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Contact us for any inquiries or feedback about PreTrack.">
    <meta name="keywords" content="PreTrack, contact us, support, feedback">
    <meta name="author" content="PreTrack">
    <link rel="icon" href="../favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="../favicon/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png">
    <link rel="manifest" href="../favicon/manifest.json">
    <link rel="shortcut icon" href="../favicon/favicon.ico">
    <title>Contact Us | PreTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        :root {
            --bg: #111827;
            --card: #1f2937;
            --card2: #273549;
            --primary: #3b82f6;
            --primary2: #2563eb;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --border: #374151;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: Inter, sans-serif;
            background:
                radial-gradient(circle at top right, #2563eb33, transparent 30%),
                radial-gradient(circle at bottom left, #06b6d433, transparent 25%),
                var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: var(--text);
        }

        .card {
            width: 100%;
            max-width: 560px;
            background: rgba(31, 41, 55, .92);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 22px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
            animation: fade .5s ease;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(20px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #06b6d4);
            font-size: 30px;
        }

        h2 {
            text-align: center;
            font-size: 2rem
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin: 8px 0 24px
        }

        .field {
            margin-bottom: 18px
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600
        }

        .input {
            position: relative;
        }

        .input i {
            position: absolute;
            left: 14px;
            top: 15px;
            color: var(--muted);
        }

        input,
        textarea {
            width: 100%;
            padding: 14px 16px 14px 42px;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: .25s;
        }

        textarea {
            min-height: 140px;
            resize: vertical
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, .18);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: .25s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, .35)
        }

        button:disabled {
            opacity: .75;
            cursor: not-allowed
        }

        #status {
            text-align: center;
            margin-top: 18px;
            font-weight: 600
        }

        .info {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid var(--border);
            display: grid;
            gap: 12px;
        }

        .info div {
            display: flex;
            gap: 12px;
            align-items: center;
            color: #d1d5db
        }

        .info i {
            color: #60a5fa;
            width: 18px
        }

        .back {
            display: inline-block;
            margin-top: 22px;
            color: #93c5fd;
            text-decoration: none;
            font-weight: 600;
        }

        .back:hover {
            text-decoration: underline
        }

        @media(max-width:600px) {
            .card {
                padding: 24px
            }

            h2 {
                font-size: 1.7rem
            }
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .social-links a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: .3s ease;
            color: #fff;
        }

        .instagram {
            background: linear-gradient(135deg, #833AB4, #E1306C, #FCAF45);
        }

        .twitter {
            background: #000;
            border: 1px solid #333;
        }

        .social-links a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, .3);
        }

        .social-links i {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="logo"><i class="fa-solid fa-envelope"></i></div>
        <h2>Contact Us</h2>
        <p class="subtitle">We'd love to hear your feedback about PreTrack.</p>

        <form id="contactForm">
            <div class="field">
                <label>Name</label>
                <div class="input">
                    <i class="fa-solid fa-user"></i>
                    <input id="name" required placeholder="Your Name">
                </div>
            </div>

            <div class="field">
                <label>Email</label>
                <div class="input">
                    <i class="fa-solid fa-envelope"></i>
                    <input id="email" type="email" required placeholder="your@email.com">
                </div>
            </div>

            <div class="field">
                <label>Subject</label>
                <div class="input">
                    <i class="fa-solid fa-tag"></i>
                    <input id="subject" required placeholder="Subject">
                </div>
            </div>

            <div class="field">
                <label>Message</label>
                <div class="input">
                    <i class="fa-solid fa-comment" style="top:18px"></i>
                    <textarea id="message" required placeholder="Write your message..."></textarea>
                </div>
            </div>

            <button id="sendBtn" type="submit"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
            <div id="status"></div>
        </form>

        <div class="social-links">
            <a href="https://www.instagram.com/pretrack001/" target="_blank" rel="noopener noreferrer"
                class="instagram">
                <i class="fab fa-instagram"></i>
                @pretrack001
            </a>

            <a href="https://x.com/pretrack001" target="_blank" rel="noopener noreferrer" class="twitter">
                <i class="fab fa-x-twitter"></i>
                @pretrack001
            </a>
        </div>
        <div class="info">
            <div><i class="fa-solid fa-envelope"></i> pretrack001@gmail.com</div>
            <div><i class="fa-solid fa-location-dot"></i> Kolkata, India</div>
            <div><i class="fa-solid fa-clock"></i> We usually reply within 24 hours.</div>
        </div>

        <a class="back" href="../login.html">← Back to Home</a>

    </div>

    <script>
        emailjs.init({ publicKey: "sdnqsrxtQaUP_Kayf" });

        const form = document.getElementById("contactForm");
        const btn = document.getElementById("sendBtn");
        const status = document.getElementById("status");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
            status.textContent = "";

            try {
                const fromName = document.getElementById("name").value;
                const replyTo = document.getElementById("email").value;
                const emailSubject = document.getElementById("subject").value;
                const emailMessage = document.getElementById("message").value;

                await emailjs.send("service_n2pz3eo", "template_thusdnn", {
                    from_name: fromName,
                    reply_to: replyTo,
                    subject: emailSubject,
                    message: emailMessage
                });

                await emailjs.send("service_n2pz3eo", "template_fefupob", {
                    from_name: fromName,
                    reply_to: replyTo,
                    subject: emailSubject,
                    message: emailMessage
                });
                status.style.color = "#22c55e";
                status.textContent = "Message sent successfully!";
                form.reset();
            } catch (err) {
                console.error(err);
                status.style.color = "#ef4444";
                status.textContent = "Failed to send message.";
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Message';
        });
    </script>

</body>

</html>
