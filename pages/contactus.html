<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#18191A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Contact us for any inquiries or feedback about PreTrack.">
  <meta name="keywords" content="PreTrack, contact us, support, feedback">
  <meta name="author" content="PreTrack">
  <link rel="icon" href="../favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="../favicon/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png">
  <link rel="manifest" href="../favicon/manifest.json">
  <link rel="shortcut icon" href="../favicon/favicon.ico">
  <title>Contact Us | PreTrack</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      background-color: #18191A;
      color: #E0E0E0;
      font-family: 'Inter', 'Roboto', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: #232526;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(12,13,15,0.3);
      max-width: 480px;
      width: 90%;
      padding: 32px 28px 24px;
      margin: 20px auto;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.4s ease-out forwards;
    }

    @media (max-width: 480px) {
      .container {
        width: 95%;
        padding: 24px 20px;
        margin: 10px auto;
        border-radius: 12px;
      }
    }
    h2 {
      margin: 0 0 18px 0;
      text-align: center;
      font-size: 2rem;
      font-weight: 600;
      color: #F5F5F5;
      letter-spacing: 0.03em;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-weight: 500;
      color: #B0B0B0;
      font-size: 0.95rem;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label.required::after {
      content: "*";
      color: #ff4444;
      font-size: 0.9em;
      margin-left: 2px;
    }
    input, textarea, button {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.5;
    }

    input, textarea {
      background: #22232E;
      color: #E0E0E0;
      border: 1px solid #2C2C2C;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: all 0.2s ease;
      outline: none;
      width: 90%;
      -webkit-tap-highlight-color: transparent;
    }
    input:focus, textarea:focus {
      border-color: #1A73E8;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }

    input:invalid, textarea:invalid {
      border-color: #ff4444;
    }

    input:disabled, textarea:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    button {
      margin-top: 8px;
      padding: 14px 24px;
      background-color: #1A73E8;
      color: #FFF;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(26,115,232,0.15);
      letter-spacing: 0.02em;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
    }

    button:active {
      transform: translateY(1px);
    }

    button:hover, button:focus {
      background-color: #1162CA;
      box-shadow: 0 4px 16px rgba(26,115,232,0.2);
    }

    button:disabled {
      background-color: #5a5a5a;
      cursor: not-allowed;
      opacity: 0.8;
    }

    button .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
    }

    button.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .info {
      border-top: 1px solid #2C2C2C;
      padding-top: 20px;
      color: #CCCCCC;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .info p {
      margin: 0 0 12px 0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .info p:last-child {
      margin-bottom: 0;
    }

    .info i {
      color: #1A73E8;
      margin-top: 3px;
      flex-shrink: 0;
    }
    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Contact Us</h2>
    <form id="contactForm" action="mailto:pretrack001@gmail.com" method="post" enctype="text/plain">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required autocomplete="name" placeholder="Enter your name">

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="Enter your email">

      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" required placeholder="Enter your subject">

      <label for="message">Message</label>
      <textarea id="message" name="message" required placeholder="Enter your message"></textarea>

      <button type="submit">Send Message</button>
    </form>

    <div class="info">
      <p><i class="fas fa-envelope"></i> <span><strong>Email:</strong> <a href="mailto:pretrack001@gmail.com" style="color: #82B1FF; text-decoration: none;">pretrack001@gmail.com</a></span></p>
      <p><i class="fas fa-phone"></i> <span><strong>Phone:</strong> <a href="#" style="color: #82B1FF; text-decoration: none;">-**********</a></span></p>
      <p><i class="fas fa-map-marker-alt"></i> <span><strong>Address:</strong> Kolkata, India</span></p>
      <p><i class="fas fa-info-circle"></i> <span>Need immediate help? Reach out to our support team and we'll respond as quickly as possible.</span></p>
    </div>
    <div>
      <center>
        <a href="../index.html">
          <button>Back to Home</button>
        </a>
      </center>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('contactForm');
      
      // Add required indicators to labels
      const requiredFields = form.querySelectorAll('[required]');
      requiredFields.forEach(field => {
        const label = form.querySelector(`label[for="${field.id}"]`);
        if (label) label.classList.add('required');
      });

      // Form validation on submit
      form.addEventListener('submit', function(e) {
        if (!form.checkValidity()) {
          e.preventDefault();
          form.reportValidity();
        }
      });
      
      // Real-time validation
      const inputs = form.querySelectorAll('input, textarea');
      inputs.forEach(input => {
        input.addEventListener('input', function() {
          input.style.borderColor = input.checkValidity() ? '#2C2C2C' : '#ff4444';
        });
      });
    });
  </script>
  </script>
</body>
</html>
